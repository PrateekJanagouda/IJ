      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        opportunity:
          allOf:
          - $ref: '#/components/schemas/OpportunityRef'
          readOnly: true
        applicant:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatus'
          readOnly: true
        cover_note:
          type: string
          readOnly: true
        portfolio_items:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioItem'
          readOnly: true
