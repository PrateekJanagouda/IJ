      enum:
      - hide_content
      - restore_content
      - close_listing
      - suspend_user
      - reinstate_user
      - dismiss
      type: string
      description: |-
        * `hide_content` - Hide Content
        * `restore_content` - Restore Content
        * `close_listing` - Close Listing
        * `suspend_user` - Suspend User
        * `reinstate_user` - Reinstate User
        * `dismiss` - Dismiss
