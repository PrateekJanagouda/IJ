          nullable: true
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
