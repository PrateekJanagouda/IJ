<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0d13">
<title>EQura</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
/* Layout: a phone running the app beside a slim control rail.
   Direction: "after hours". The night is where gigs live, so the app is dark-first: ink-black
   paper, fluorescent riso inks, screen-printed flyers taped to a wall, venue marquee type.
   Signature: EQ bars (the name is the logo) used for brand, progress and capacity. */
:root {
  --paper: #0f0d13;  --card: #1a1720;  --sunk: #26222e;  --wall: #15121a;
  --ink: #f3f0ea;    --ink-2: #b9b2c2;  --ink-3: #8b8495;  --rule: #2f2a37;
  --pink: #ff4fa8;   --blue: #6b8cff;   --yellow: #ffd23a; --teal: #2cc6c0; --orange: #ff7a3d;
  --on-ink: #0f0d13; --poster-ink: #141118; --tape: rgb(240 230 200 / 0.55);
  --ok: #3fd18e; --warn: #f2b23e; --bad: #ff6b85; --info: #8aa4ff;
  --stage: #070609; --frame: #26222d; --halftone: rgb(0 0 0 / 0.28);
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --body: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --marker: "Permanent Marker", "Comic Sans MS", "Chalkboard SE", cursive;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --paper: #f0eee9; --card: #fbfaf7; --sunk: #e3e0da; --wall: #e6e3dc;
  --ink: #16141b; --ink-2: #55505e; --ink-3: #847f8c; --rule: #d5d1ca;
  --pink: #e01f85; --blue: #2d55d0; --yellow: #f5c518; --teal: #0d8783; --orange: #f05a1a;
  --on-ink: #fbfaf7; --tape: rgb(225 210 170 / 0.7);
  --ok: #138552; --warn: #9c5d00; --bad: #c92a48; --info: #2d55d0;
  --stage: #d9d6cf; --frame: #1c1a21; --halftone: rgb(20 17 24 / 0.2); color-scheme: light; } }
:root[data-theme="light"] {
  --paper: #f0eee9; --card: #fbfaf7; --sunk: #e3e0da; --wall: #e6e3dc;
  --ink: #16141b; --ink-2: #55505e; --ink-3: #847f8c; --rule: #d5d1ca;
  --pink: #e01f85; --blue: #2d55d0; --yellow: #f5c518; --teal: #0d8783; --orange: #f05a1a;
  --on-ink: #fbfaf7; --tape: rgb(225 210 170 / 0.7);
  --ok: #138552; --warn: #9c5d00; --bad: #c92a48; --info: #2d55d0;
  --stage: #d9d6cf; --frame: #1c1a21; --halftone: rgb(20 17 24 / 0.2); color-scheme: light; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--stage); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; border-radius: 6px; }

/* ---------- EQ signature ---------- */
.eq { display: inline-flex; align-items: flex-end; gap: 3px; height: 1em; }
.eq i { width: 0.2em; border-radius: 2px; background: currentColor; height: 40%; animation: eq 1.1s ease-in-out infinite alternate; }
.eq i:nth-child(1) { animation-duration: 0.9s; } .eq i:nth-child(2) { animation-duration: 0.6s; height: 80%; }
.eq i:nth-child(3) { animation-duration: 1.2s; height: 60%; } .eq i:nth-child(4) { animation-duration: 0.75s; height: 95%; } .eq i:nth-child(5) { animation-duration: 1s; }
.eq.still i { animation: none; }
@keyframes eq { 0% { height: 18%; } 100% { height: 100%; } }
.logo { display: inline-flex; align-items: flex-end; gap: 8px; font-family: var(--display); font-weight: 900; text-transform: none; letter-spacing: 0.01em; line-height: 0.85; }  /* brand is always written "EQura" */
.logo .eq { color: var(--pink); }

/* ---------- Stage & rail ---------- */
.stage { min-height: 100%; display: flex; gap: 52px; justify-content: center; align-items: center; padding-block: 24px; }
.rail { width: 290px; display: flex; flex-direction: column; gap: 18px; }
.rail .logo { font-size: 54px; }
.rail p { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 34ch; }
.kicker { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.who { display: flex; flex-direction: column; gap: 6px; }
.who button { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; border: 1.5px solid transparent; }
.who button:hover { background: var(--card); }
.who button.on { border-color: var(--pink); background: var(--card); }
.who b { display: block; font-weight: 650; font-size: 14px; }
.who small { color: var(--ink-3); font-size: 12px; }
.tries { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 7px; font-size: 13.5px; color: var(--ink-2); }
.tries b { color: var(--ink); font-weight: 650; }
.rail-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.ghost-btn { border: 1.5px solid var(--rule); border-radius: 10px; padding: 7px 12px; font-size: 13px; color: var(--ink-2); }
.ghost-btn:hover { border-color: var(--ink-2); }

.phone { position: relative; width: 390px; height: min(844px, calc(100dvh - 48px)); min-height: 640px; border-radius: 46px; border: 11px solid var(--frame);
  background: var(--paper); overflow: hidden; box-shadow: 0 0 0 1px rgb(255 255 255 / 0.04), 0 50px 120px -30px rgb(255 79 168 / 0.25), 0 40px 80px -20px rgb(0 0 0 / 0.6); flex: none; }
.scroll { position: absolute; inset: 0 0 72px 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }

@media (max-width: 760px) {
  body { padding-left: 0; padding-right: 0; }
  .stage { flex-direction: column; gap: 0; padding-block: 0; justify-content: flex-start; }
  .rail { width: 100%; padding: 8px max(12px, env(safe-area-inset-left, 0px)); gap: 6px; }
  .rail .logo, .rail p, .tries, .rail .kicker, .rail-actions { display: none; }
  .who { flex-direction: row; }
  .who button { flex: 1; padding: 5px 6px; gap: 6px; min-width: 0; }
  .who b { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who small { display: none; }
  .who .av { width: 26px; height: 26px; font-size: 10px; }
  .phone { width: 100%; height: calc(100dvh - 52px); min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
}

/* ---------- Type ---------- */
.display { font-family: var(--display); font-weight: 900; text-transform: uppercase; letter-spacing: 0.005em; line-height: 0.9; text-wrap: balance; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.marker { font-family: var(--marker); font-weight: 400; }
.eyebrow { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); }
.small { font-size: 13px; } .tiny { font-size: 12px; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }

/* ---------- Structure ---------- */
.row { display: flex; align-items: center; gap: 10px; }
.col { display: flex; flex-direction: column; gap: 6px; }
.wrap { flex-wrap: wrap; } .grow { flex: 1; min-width: 0; }
.page { padding: 4px 18px 28px; display: flex; flex-direction: column; gap: 24px; }
.section { display: flex; flex-direction: column; gap: 12px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.section-head h3 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 26px; text-transform: uppercase; line-height: 1; }

/* ---------- Header & marquee ---------- */
.head { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(14px); padding: 12px 18px 10px; }
.head-row { display: flex; align-items: center; gap: 4px; min-height: 42px; }
.head .title { flex: 1; min-width: 0; font-size: 38px; }
.head .sub { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 6px; height: 54px; padding: 0 10px;
  background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--rule); }
.bar .t { flex: 1; min-width: 0; font-weight: 650; font-size: 16px; }
.icon-btn { width: 42px; height: 42px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; position: relative; color: var(--ink); }
.icon-btn:hover { background: var(--sunk); }
.badge { position: absolute; top: 5px; right: 4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--pink); color: #fff;
  font: 700 10px/14px var(--mono); text-align: center; border: 2px solid var(--paper); }
.marquee { overflow: hidden; background: var(--pink); color: #fff; border-block: 2px solid var(--poster-ink); white-space: nowrap; }
.marquee .run { display: inline-flex; gap: 0; padding: 7px 0; animation: ticker 28s linear infinite; font: 600 12px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; }
.marquee .run span { padding-right: 26px; }
.marquee .run span::after { content: "✦"; padding-left: 26px; }
@keyframes ticker { to { transform: translateX(-50%); } }

/* ---------- Nav ---------- */
.nav { position: absolute; left: 0; right: 0; bottom: 0; height: 72px; padding: 6px 8px 10px; display: grid; grid-template-columns: repeat(5, 1fr);
  background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(14px); border-top: 1px solid var(--rule); z-index: 30; }
.nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--ink-3); position: relative; }
.nav button .pill { width: 52px; height: 30px; border-radius: 99px; display: grid; place-items: center; transition: background 0.15s; }
.nav button.on { color: var(--ink); }
.nav button.on .pill { background: var(--pink); color: #fff; }
.nav .badge { top: 0; right: calc(50% - 30px); border-color: var(--card); background: var(--yellow); color: var(--poster-ink); }

/* ---------- Avatars ---------- */
.av { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 800 14px var(--body); color: var(--poster-ink); overflow: hidden; position: relative; }
.av.sm { width: 28px; height: 28px; font-size: 10px; } .av.lg { width: 92px; height: 92px; font-size: 30px; border: 4px solid var(--paper); }

/* ---------- Generative screen-print covers ---------- */
.cover { position: relative; overflow: hidden; isolation: isolate; }
.cover::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, var(--halftone) 1.1px, transparent 1.4px) 0 0 / 5px 5px; mix-blend-mode: multiply; pointer-events: none; z-index: 0; }
.cover > * { position: relative; z-index: 1; }
.pline { font: 600 10px var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--poster-ink); }

/* ---------- Flyer wall ---------- */
.wall { display: flex; gap: 16px; overflow-x: auto; scrollbar-width: none; margin: 0 -18px; padding: 18px 22px 22px; scroll-snap-type: x mandatory;
  background: radial-gradient(circle at 20% 30%, rgb(255 255 255 / 0.03), transparent 40%), var(--wall); border-block: 1px solid var(--rule); }
.wall::-webkit-scrollbar { display: none; }
.flyer { flex: none; width: 218px; scroll-snap-align: center; position: relative; transform: rotate(var(--tilt, -1.5deg)); transition: transform 0.25s ease; text-align: left;
  box-shadow: 0 14px 24px -14px rgb(0 0 0 / 0.6); }
.flyer:hover, .flyer:focus-visible { transform: rotate(0deg) translateY(-4px) scale(1.02); }
.flyer::before { content: ""; position: absolute; top: -10px; left: 50%; width: 74px; height: 22px; margin-left: -37px; background: var(--tape); transform: rotate(calc(var(--tilt, -1.5deg) * -2)); z-index: 3;
  clip-path: polygon(3% 0, 97% 4%, 100% 100%, 0 94%); }
.flyer .art { height: 248px; padding: 14px 14px 12px; display: flex; flex-direction: column; justify-content: space-between; }
.flyer .art .display { font-size: 38px; color: var(--poster-ink); }
.flyer .strip { background: #fbfaf7; color: var(--poster-ink); padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.flyer .strip b { font: 600 13px var(--mono); }
.sticker { position: absolute; z-index: 4; font-family: var(--marker); font-size: 15px; line-height: 1; padding: 7px 10px 6px; color: var(--poster-ink); background: var(--yellow);
  transform: rotate(8deg); box-shadow: 0 4px 10px rgb(0 0 0 / 0.3); border-radius: 3px; }
.sticker.round { border-radius: 50%; width: 62px; height: 62px; display: grid; place-items: center; text-align: center; padding: 6px; font-size: 13px; }

/* ---------- Ticket ---------- */
.ticket { display: grid; grid-template-columns: 1fr 96px; border-radius: 18px; overflow: hidden; background: var(--ink); color: var(--on-ink); position: relative; width: 100%; text-align: left; }
.ticket .main { padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ticket .stub { position: relative; background: var(--pink); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 12px 6px; }
.ticket .stub::before { content: ""; position: absolute; left: -1px; top: 12px; bottom: 12px; border-left: 2px dashed var(--ink); }
.ticket::before, .ticket::after { content: ""; position: absolute; right: 86px; width: 20px; height: 20px; border-radius: 50%; background: var(--paper); z-index: 2; }
.ticket::before { top: -10px; } .ticket::after { bottom: -10px; }
.ticket .stub .big { font-family: var(--display); font-weight: 900; font-size: 48px; line-height: 0.85; }
.ticket .t-title { font-family: var(--display); font-weight: 900; font-size: 28px; line-height: 0.92; text-transform: uppercase; }
.ticket .meta { font-size: 13px; opacity: 0.75; }
.countdown { display: flex; gap: 6px; }
.countdown span { display: flex; flex-direction: column; align-items: center; padding: 4px 8px; border-radius: 8px; background: color-mix(in srgb, var(--on-ink) 10%, transparent); }
.countdown b { font: 600 18px var(--mono); line-height: 1.1; }
.countdown small { font: 600 9px var(--mono); letter-spacing: 0.1em; opacity: 0.7; }

/* ---------- Celebration ---------- */
.celebrate { position: relative; border-radius: 22px; overflow: hidden; padding: 22px 18px 18px; text-align: center; color: #fff; background: var(--poster-ink); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.celebrate .rays { position: absolute; inset: -60%; background: repeating-conic-gradient(from 0deg, var(--pink) 0 9deg, transparent 9deg 18deg); opacity: 0.55; animation: spin 24s linear infinite; z-index: 0; }
.celebrate::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 42%, transparent 0 30%, var(--poster-ink) 72%); z-index: 0; }
.celebrate > *:not(.rays) { position: relative; z-index: 1; }
.celebrate .display { font-size: 52px; color: var(--yellow); text-shadow: 3px 3px 0 var(--pink); }
.celebrate .eq { font-size: 46px; color: var(--yellow); gap: 5px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Chips & tags ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -18px; padding: 0 18px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 36px; padding: 0 14px; border-radius: 99px; background: var(--card); border: 1.5px solid var(--rule); font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.chip.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 6px; font: 600 11px var(--mono); letter-spacing: 0.04em; text-transform: uppercase; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
.tag.match { background: color-mix(in srgb, var(--pink) 16%, transparent); color: var(--pink); }
.state { display: inline-flex; align-items: center; gap: 6px; font: 600 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
.state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.state.submitted { color: var(--info); } .state.shortlisted { color: var(--warn); }
.state.accepted, .state.confirmed, .state.completed, .state.published { color: var(--ok); }
.state.declined, .state.cancelled, .state.withdrawn, .state.closed { color: var(--bad); }
.state.draft { color: var(--ink-3); }

/* ---------- Buttons & fields ---------- */
.btn { height: 50px; padding: 0 20px; border-radius: 14px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--sunk); color: var(--ink); text-align: center; }
.btn.primary { background: var(--ink); color: var(--on-ink); }
.btn.pink { background: var(--pink); color: #fff; box-shadow: 0 8px 24px -10px var(--pink); }
.btn.line { background: transparent; border: 1.5px solid var(--rule); }
.btn.bad { background: transparent; border: 1.5px solid color-mix(in srgb, var(--bad) 45%, transparent); color: var(--bad); }
.btn.block { width: 100%; } .btn.sm { height: 38px; font-size: 13px; padding: 0 14px; border-radius: 11px; }
.btn:disabled { opacity: 0.38; cursor: not-allowed; box-shadow: none; }
.btn:active:not(:disabled) { transform: scale(0.98); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-size: 13px; font-weight: 650; color: var(--ink-2); }
.input, .textarea, .select { width: 100%; min-height: 48px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--rule); background: var(--card); color: var(--ink); outline: none; }
.textarea { min-height: 96px; resize: vertical; }
.input:focus, .textarea:focus, .select:focus { border-color: var(--pink); }
.input:disabled { opacity: 0.5; }
.hint { font-size: 12px; color: var(--ink-3); }

/* ---------- Gig row ---------- */
.gig-row { display: grid; grid-template-columns: 68px 1fr; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); width: 100%; text-align: left; }
.gig-row:last-child { border-bottom: 0; }
.thumb { flex: none; width: 68px; height: 68px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--poster-ink); }
.thumb .d { font-family: var(--display); font-weight: 900; font-size: 30px; line-height: 0.88; }
.thumb .m { font: 600 10px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
.gig-row h4 { margin: 0; font-size: 15px; font-weight: 650; line-height: 1.25; }
.facts { display: flex; gap: 10px; flex-wrap: wrap; font: 500 12px var(--mono); color: var(--ink-2); }
.facts .pay { color: var(--yellow); font-weight: 600; }

/* ---------- Gig detail ---------- */
.hero-cover { height: 340px; padding: 64px 18px 18px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; color: var(--poster-ink); }
.hero-cover .display { font-size: 54px; animation: slam 0.45s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
@keyframes slam { from { transform: scale(1.15); opacity: 0; } }
.float { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; z-index: 3; }
.float-btn { width: 40px; height: 40px; border-radius: 50%; background: #fbfaf7; color: var(--poster-ink); display: grid; place-items: center; box-shadow: 0 2px 10px rgb(0 0 0 / 0.2); }
.stubline { display: grid; grid-template-columns: repeat(3, 1fr); border: 1.5px solid var(--ink); border-radius: 14px; overflow: hidden; }
.stubline > div { padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stubline > div + div { border-left: 1.5px dashed var(--ink); }
.stubline b { font-family: var(--display); font-weight: 900; font-size: 24px; line-height: 1; }
.checklist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.checklist li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; }
.checklist li::before { content: ""; width: 16px; height: 16px; margin-top: 3px; border-radius: 4px; border: 1.5px solid var(--ink-2); }
.host { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: var(--card); border: 1px solid var(--rule); }

/* ---------- Journey as EQ levels ---------- */
.journey { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; align-items: end; }
.journey .step { display: flex; flex-direction: column; gap: 6px; font-size: 11px; font-weight: 600; color: var(--ink-3); }
.journey .step i { border-radius: 3px; background: var(--sunk); }
.journey .step:nth-child(1) i { height: 8px; } .journey .step:nth-child(2) i { height: 13px; } .journey .step:nth-child(3) i { height: 18px; } .journey .step:nth-child(4) i { height: 23px; }
.journey .step.done { color: var(--ink); } .journey .step.done i { background: var(--ink); }
.journey .step.now { color: var(--pink); } .journey .step.now i { background: var(--pink); animation: pulse 1.4s ease-in-out infinite; }
.journey .step.stop { color: var(--bad); } .journey .step.stop i { background: var(--bad); }
@keyframes pulse { 50% { opacity: 0.35; } }

/* ---------- Tracker ---------- */
.track { display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--rule); width: 100%; }
.track.booked { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }

<div class="stage">

<script>
/* EQura client: the artist-first UI on top of the real Django API (same-origin /api/v1). */

/* ======================= API client ======================= */
const API = "/api/v1";
const csrf = () => { const m = document.cookie.match(/(?:^|; )csrftoken=([^;]+)/); return m ? decodeURIComponent(m[1]) : ""; };
class ApiErr extends Error {
  constructor(status, body) { super(body?.message || "Something went wrong. Try again."); this.status = status; this.body = body; }
  /** First field-level validation message, if any. */
  get text() {
    const fields = this.body?.details?.fields || {};
    for (const [k, v] of Object.entries(fields)) { const m = Array.isArray(v) ? v[0] : v; if (m) return `${k.replace(/_/g, " ")}: ${typeof m === "string" ? m : JSON.stringify(m)}`; }
    return this.message;
  }
}
async function api(path, { method = "GET", body } = {}) {
  const [p, q] = path.split("?");
  const url = API + (p.endsWith("/") ? p : p + "/") + (q ? "?" + q : "");
  const headers = { Accept: "application/json" };
  if (method !== "GET") {
    if (!csrf()) await fetch(API + "/auth/csrf/", { credentials: "same-origin" });
    headers["X-CSRFToken"] = csrf(); headers["Content-Type"] = "application/json";
  }
  let res;
  try { res = await fetch(url, { method, headers, credentials: "same-origin", body: body === undefined ? undefined : JSON.stringify(body) }); }
  catch { throw new ApiErr(0, { message: "Can't reach EQura. Check your connection." }); }
  if (res.status === 204) return null;
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new ApiErr(res.status, data?.error);
  return data;
}
const list = async (path) => { const d = await api(path); return Array.isArray(d) ? d : d?.results || []; };
const post = (path, body = {}) => api(path, { method: "POST", body });
const del = (path) => api(path, { method: "DELETE" });

/* ======================= State (rebuilt from the API on every refresh) ======================= */
const DAY = 86400000;
let S = blank();
function blank() { return { users: {}, events: {}, gigs: [], apps: [], bookings: [], posts: [], followingFeed: new Set(), comments: {}, convos: [], messages: {}, notifs: [],
  venues: {}, venueReqs: [], venueBookings: {}, avail: {} }; }
const ui = { tab: "gigs", stack: [], sheet: null, filter: "all", q: "", scene: "everyone", mine: null, reviewIdx: 0, toast: null, confirm: null, draft: null, playing: null, busy: false,
  compose: [], cal: null, vq: "", vform: null, lightbox: null };
const store = { me: null, ready: false, offline: false };
const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const celebrated = new Set(JSON.parse(lsGet("equra-celebrated") || "[]"));
const saveCelebrated = () => lsSet("equra-celebrated", JSON.stringify([...celebrated]));

function addUser(S, ref) {
  if (!ref?.id) return;
  const u = S.users[ref.id] || { id: ref.id, roles: [], genres: [], skills: [], portfolio: [], headline: "", city: "", bio: "", shows: 0 };
  S.users[ref.id] = { ...u, name: ref.display_name || u.name || "Someone", profileId: ref.profile_id || u.profileId };
}
function fromProfile(S, p) {
  addUser(S, { id: p.user_id, display_name: p.display_name, profile_id: p.id });
  const u = S.users[p.user_id];
  Object.assign(u, {
    headline: p.headline || "", city: p.location_label || "", bio: p.bio ?? u.bio,
    roles: p.roles || u.roles || (p.artist ? ["artist"] : []), genres: p.artist?.genres || [], skills: p.artist?.skills || [],
    portfolio: p.portfolio ? p.portfolio.map(toWork) : u.portfolio, followers: p.follower_count ?? u.followers, following: p.following_count ?? u.following,
    viewerFollowing: p.viewer_is_following ?? u.viewerFollowing, full: !!p.portfolio || u.full,
  });
}
const toWork = (w) => ({ id: w.id, title: w.title, sub: { video: "Video", audio: "Audio" }[w.item_type] || "Link", type: w.item_type, url: w.url });
function toGig(S, o) {
  addUser(S, o.owner);
  if (o.event) S.events[o.event.id] = { id: o.event.id, title: o.event.title };
  const [venue, ...rest] = (o.location_text || "").split(",");
  const hrs = o.ends_at && o.starts_at ? Math.round((new Date(o.ends_at) - new Date(o.starts_at)) / 3600000) : 0;
  return { id: o.id, owner: o.owner.id, title: o.title, type: o.opportunity_type, comp: o.compensation_type, amount: o.compensation_amount ? Number(o.compensation_amount) : null,
    capacity: o.capacity, starts: o.starts_at || o.created_at, deadline: o.application_deadline || o.starts_at, venue: venue.trim() || (o.is_online ? "Online" : "Venue TBC"),
    area: rest.join(",").trim(), genres: o.genres || [], desc: o.description || "", provides: [], bring: (o.requirements || "").split(/\n+/).map((x) => x.trim()).filter(Boolean),
    set: hrs ? `${hrs} hr${hrs > 1 ? "s" : ""}` : "", status: o.status, accepting: o.accepting_applications, event: o.event?.id || null, at: o.created_at };
}
function toApp(S, a) {
  addUser(S, a.applicant);
  return { id: a.id, gig: a.opportunity.id, gigTitle: a.opportunity.title, user: a.applicant.id, status: a.status, note: a.cover_note || "",
    works: (a.portfolio_items || []).map(toWork), at: a.submitted_at, booking: a.booking?.id || null };
}
function toBooking(S, b) {
  addUser(S, b.performer);
  return { id: b.id, app: b.application_id, gig: b.opportunity.id, user: b.performer.id, status: b.status, at: b.selected_at };
}
function toPost(S, p) {
  addUser(S, p.author);
  if (p.repost_of && !S.posts.some((x) => x.id === p.repost_of.id)) {
    addUser(S, p.repost_of.author);
    S.posts.push({ id: p.repost_of.id, author: p.repost_of.author.id, body: p.repost_of.body, at: p.repost_of.created_at, likes: 0, liked: false, cc: 0, stub: true });

/** Pull everything this viewer can see. Builds a fresh state, then swaps it in. */
async function refresh() {
  const N = blank(); N.comments = S.comments; N.messages = S.messages;
  for (const id in S.users) if (S.users[id].full) N.users[id] = S.users[id]; // keep loaded profiles
  const signedIn = !!store.me;
  N.avail = S.avail;
  const [opps, discover, venues, mine] = await Promise.all([
    list("/opportunities"), list("/feed/discover"), list("/venues"),
    signedIn ? Promise.all([api("/profiles/me"), list("/applications/mine"), list("/bookings/mine"), list("/opportunities/managed"), list("/feed"), list("/conversations"), list("/notifications"),
      list("/venues?managed=true"), list("/venue-bookings/mine")]) : null,
  ]);
  venues.forEach((v) => { N.venues[v.id] = toVenue(N, v); });
  const gigs = new Map(opps.map((o) => [o.id, o]));
  discover.forEach((p) => toPost(N, p));
  if (mine) {
    const [prof, apps, bookings, managed, feed, convos, notifs, myVenues, venueReqs] = mine;
    myVenues.forEach((v) => { N.venues[v.id] = toVenue(N, v); });
    N.venueReqs = venueReqs.map((b) => toVB(N, b));
    (await Promise.all(myVenues.map((v) => list(`/venues/${v.id}/bookings`).then((rows) => [v.id, rows]))))
      .forEach(([vid, rows]) => { N.venueBookings[vid] = rows.map((b) => toVB(N, b)); });
    fromProfile(N, prof);
    N.users[store.me.id].roles = store.me.roles;
    managed.forEach((o) => gigs.set(o.id, o));
    const per = await Promise.all(managed.map((o) => Promise.all([list(`/opportunities/${o.id}/applications`), list(`/opportunities/${o.id}/bookings`)])));
    const seen = new Set();
    for (const a of [...apps, ...per.flatMap((x) => x[0])]) if (!seen.has(a.id)) { seen.add(a.id); N.apps.push(toApp(N, a)); }
    const seenB = new Set();
    for (const b of [...bookings, ...per.flatMap((x) => x[1])]) if (!seenB.has(b.id)) { seenB.add(b.id); N.bookings.push(toBooking(N, b)); }
    // Gigs I applied to that are no longer listed (closed, completed): fetch them so history still renders.
    const missing = [...new Set(N.apps.map((a) => a.gig))].filter((id) => !gigs.has(id));
    (await Promise.all(missing.map((id) => api(`/opportunities/${id}`).catch(() => null)))).forEach((o) => o && gigs.set(o.id, o));
    feed.forEach((p) => { toPost(N, p); N.followingFeed.add(p.id); });
    N.convos = convos.map((c) => { c.participants.forEach((x) => addUser(N, x));
      return { id: c.id, users: c.participants.map((x) => x.id), unread: c.unread_count, last: c.last_message ? { from: c.last_message.sender_id, body: c.last_message.preview, at: c.last_message_at } : null }; });
    N.notifs = notifs.map((n) => toNotif(N, n));
  }
  N.gigs = [...gigs.values()].map((o) => toGig(N, o));
  S = N; store.ready = true; store.offline = false;
}

/* ---- Uploads: photos are shrunk on the phone first (saves data and server space) ---- */
const MAX_VIDEO_MB = 25;
async function shrinkImage(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file; // GIFs keep their animation
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    if (scale === 1 && file.size < 1.5e6) return file;
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
    return blob ? new File([blob], "photo.jpg", { type: "image/jpeg" }) : file;
  } catch { return file; }
}
async function uploadMedia(file) {
  if (file.type.startsWith("video/") && file.size > MAX_VIDEO_MB * 1024 * 1024) throw new ApiErr(400, { message: `Videos can be up to ${MAX_VIDEO_MB} MB. Trim it and try again.` });
  const body = new FormData(); body.append("file", file.type.startsWith("image/") ? await shrinkImage(file) : file);
  if (!csrf()) await fetch(API + "/auth/csrf/", { credentials: "same-origin" });
  let res;
  try { res = await fetch(API + "/media/", { method: "POST", headers: { "X-CSRFToken": csrf(), Accept: "application/json" }, credentials: "same-origin", body }); }
  catch { throw new ApiErr(0, { message: "Upload failed. Check your connection." }); }
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new ApiErr(res.status, data?.error || { message: res.status === 413 ? "That file is too large." : "Upload failed." });
  return data;
}
function pickedFiles(list) {
  return `<div class="picks">${list.map((f) => `<div class="pick-thumb">${f.kind === "video" ? `<video src="${f.preview}" muted playsinline></video><span class="tag">Video</span>` : `<img src="${f.preview}" alt="">`}
    <button type="button" class="rm" data-a="rmfile" data-id="${f.key}" aria-label="Remove">${ic("x", 14)}</button></div>`).join("")}</div>`;
}
function addFiles(target, files, max) {
  for (const file of files) {
    if (target.length >= max) { toast(`Up to ${max} files.`, true); break; }
    const kind = file.type.startsWith("video/") ? "video" : file.type.startsWith("image/") ? "image" : null;
    if (!kind) { toast("Pick a photo or a video.", true); continue; }
    if (kind === "video" && file.size > MAX_VIDEO_MB * 1024 * 1024) { toast(`Videos can be up to ${MAX_VIDEO_MB} MB.`, true); continue; }
    target.push({ key: Math.random().toString(36).slice(2), file, kind, preview: URL.createObjectURL(file) });
  }
}

const isoDay = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const todayIso = () => isoDay(new Date(Date.now() + (330 + new Date().getTimezoneOffset()) * 60000)); // India date
const istDayOf = (iso) => isoDay(new Date(new Date(iso).getTime() + (330 + new Date().getTimezoneOffset()) * 60000));
const slotLabel = (s, e) => `${time(s)}–${time(e)}${istDayOf(e) !== istDayOf(s) && time(e) !== "12am" ? " (next day)" : ""}`;
const TIMES = Array.from({ length: 48 }, (_, i) => `${String(Math.floor(i / 2)).padStart(2, "0")}:${i % 2 ? "30" : "00"}`);
const PRESETS = [["Afternoon", "12:00", "17:00"], ["Evening", "18:00", "23:00"], ["Late night", "21:00", "02:00"], ["Full day", "10:00", "23:00"]];
/** The chosen slot as ISO strings with the venue's offset; an end at or before the start is next day. */
function chosenSlot(day, start, end) {
  const s = new Date(`${day}T${start}:00+05:30`); let e = new Date(`${day}T${end}:00+05:30`);
  if (e <= s) e = new Date(e.getTime() + DAY);
  return { starts_at: s.toISOString(), ends_at: e.toISOString() };
}
const overlaps = (a, b) => new Date(a.starts_at) < new Date(b.ends) && new Date(b.starts) < new Date(a.ends_at);
const prettyDay = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" });
function calendar(v) {
  const slots = S.avail[v.id], cal = ui.cal?.venue === v.id ? ui.cal : { off: 0, sel: null };
  const marks = slots && Object.fromEntries([...new Set(slots.map((x) => x.day))].map((d) => {
    const st = slots.filter((x) => x.day === d).map((x) => x.status);
    return [d, st.includes("requested_by_you") ? "requested_by_you" : st.includes("has_requests") ? "has_requests" : "busy"];
  }));
  const today = todayIso(), t = new Date(today + "T12:00:00"), max = isoDay(new Date(t.getTime() + 91 * DAY));
  const first = new Date(t.getFullYear(), t.getMonth() + cal.off, 1), lead = (first.getDay() + 6) % 7;
  const days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const label = { busy: "Some times taken", requested_by_you: "Your request", has_requests: "Requests waiting" };
  let cells = Array.from({ length: lead }, () => `<span></span>`).join("");
  for (let d = 1; d <= days; d++) {
    const iso = isoDay(new Date(first.getFullYear(), first.getMonth(), d)), m = marks?.[iso];
    const off = iso < today || iso > max, cls = [off ? "past" : m || "free", cal.sel === iso ? "sel" : "", iso === today ? "today" : ""].join(" ");
    cells += off ? `<span class="day ${cls}">${d}</span>` : `<button class="day ${cls}" data-a="pickday" data-id="${iso}" aria-label="${prettyDay(iso)}: ${label[m] || "Free"}">${d}</button>`;
  }
  return `<div class="cal"><div class="row" style="justify-content:space-between"><button class="icon-btn" data-a="calnav" data-id="-1" ${cal.off <= 0 ? "disabled" : ""} aria-label="Previous month">${ic("left", 18)}</button>
      <b>${first.toLocaleDateString("en-IN", { month: "long", year: "numeric" })}</b><button class="icon-btn" data-a="calnav" data-id="1" ${cal.off >= 2 ? "disabled" : ""} aria-label="Next month">${ic("right", 18)}</button></div>
    <div class="cal-grid">${["M", "T", "W", "T", "F", "S", "S"].map((x) => `<span class="dow">${x}</span>`).join("")}${marks ? cells : `<span style="grid-column:1/-1" class="small muted">Loading availability…</span>`}</div>
    <div class="legend"><span><i class="free"></i>Free</span><span><i class="busy"></i>Some times taken</span><span><i class="requested_by_you"></i>Your request</span>${v.mine ? `<span><i class="has_requests"></i>Requests</span>` : ""}</div></div>`;
}
/** The selected day: what's taken, a time picker, and a live clash check. */
function dayPanel(v) {
  const cal = ui.cal, day = cal.sel, slots = (S.avail[v.id] || []).filter((x) => x.day === day || istDayOf(x.ends) === day);
  const taken = slots.filter((x) => x.status === "booked" || x.status === "blocked");
  const pick = chosenSlot(day, cal.start, cal.end), clash = taken.find((x) => overlaps(pick, x));
  const opt = (sel) => TIMES.map((t) => `<option value="${t}" ${t === sel ? "selected" : ""}>${time(`${day}T${t}:00+05:30`)}</option>`).join("");
  const mine = v.mine ? (S.venueBookings[v.id] || []).filter((b) => istDayOf(b.starts) === day) : [];
  const myReqs = S.venueReqs.filter((b) => b.venue === v.id && istDayOf(b.starts) === day && ["requested", "confirmed"].includes(b.status));
  return `<div class="daypanel"><b>${prettyDay(day)}</b>
    ${taken.length ? `<div class="col" style="gap:6px"><span class="eyebrow">Already taken</span>${taken.map((x) => {
      const blk = v.mine && x.status === "blocked" && mine.find((b) => b.status === "blocked" && b.starts === x.starts);
      return `<div class="slot ${x.status}"><span>${slotLabel(x.starts, x.ends)}</span><span class="tiny">${x.status === "booked" ? "Booked" : "Unavailable"}</span>${blk ? `<button class="btn sm line" data-a="unblock" data-id="${blk.id}">Unblock</button>` : ""}</div>`;
    }).join("")}</div>` : `<span class="small muted">Nothing booked yet. The whole day is open.</span>`}
    ${myReqs.map((b) => `<div class="slot requested_by_you"><span>${slotLabel(b.starts, b.ends)}</span><span class="tiny">${b.status === "confirmed" ? "Your booking" : "Your request"}</span>${b.status === "requested" ? `<button class="btn sm line" data-a="cancelvreq" data-id="${b.id}">Cancel</button>` : ""}</div>`).join("")}
    <span class="eyebrow">${v.mine ? "Block a time" : "Choose your time"}</span>
    <div class="chips" style="margin:0;padding:0;flex-wrap:wrap">${PRESETS.map(([n, a, b]) => `<button class="chip ${cal.start === a && cal.end === b ? "on" : ""}" data-a="preset" data-id="${a}|${b}">${n}</button>`).join("")}</div>
    <div class="row"><div class="field grow"><label for="sl-start">From</label><select id="sl-start" class="select" data-slot="start">${opt(cal.start)}</select></div>
      <div class="field grow"><label for="sl-end">To</label><select id="sl-end" class="select" data-slot="end">${opt(cal.end)}</select></div></div>
    <div class="small ${clash ? "" : "muted"}" style="${clash ? "color:var(--bad);font-weight:650" : ""}">${clash ? `Overlaps ${slotLabel(clash.starts, clash.ends)}. Pick another time.` : `${slotLabel(pick.starts_at, pick.ends_at)} is free.`}</div></div>`;
}

  mine() {
    const u = me();
    if (!u) return bigHead("My gigs", "", signInBtn()) + signIn("track your gigs");
    const myVenues = Object.values(S.venues).filter((v) => v.mine);
    const views = [has("artist") && ["playing", "Playing"], (has("organizer") || S.venueReqs.length) && ["hosting", "Hosting"], (has("venue") || myVenues.length) && ["venue", "My venue"]].filter(Boolean);
    if (!views.length) views.push(["playing", "Playing"]);
    const view = views.some(([k]) => k === ui.mine) ? ui.mine : (views.find(([k]) => k === "hosting" && S.gigs.some(manages)) || views.find(([k]) => k === "venue" && myVenues.length) || views[0])[0];
    const seg = views.length > 1 ? `<div class="seg" role="tablist">${views.map(([k, t]) => `<button class="${view === k ? "on" : ""}" data-a="mineview" data-id="${k}" role="tab" aria-selected="${view === k}">${t}</button>`).join("")}</div>` : "";
    let body;
    if (view === "playing") {
      const rows = S.apps.filter((a) => a.user === u.id && gig(a.gig)).map((a) => ({ a, g: gig(a.gig), b: bookingFor(a) }));
      const isBooked = (r) => r.a.status === "accepted" && r.b?.status === "confirmed";
      const upcoming = rows.filter(isBooked).sort((x, y) => x.g.starts.localeCompare(y.g.starts));
      const review = rows.filter((r) => ["submitted", "shortlisted"].includes(r.a.status)).sort((x, y) => (y.a.status === "shortlisted") - (x.a.status === "shortlisted"));
      const done = rows.filter((r) => !isBooked(r) && !review.includes(r));
      const card = (r) => { const { a, g, b } = r, hostName = first(g.owner);
        let foot = "";
        if (isBooked(r)) foot = ui.confirm === b.id
          ? `<div class="col"><span class="small">Cancel this booking? ${esc(hostName)} will be told right away and the spot reopens.</span><div class="row"><button class="btn sm bad grow" data-a="cancelbooking" data-id="${b.id}">Cancel booking</button><button class="btn sm line grow" data-a="keep">Keep it</button></div></div>`
          : `<div class="row"><button class="btn sm pink grow" data-a="message" data-id="${g.owner}">Message ${esc(hostName)}</button><button class="btn sm line" data-a="askcancel" data-id="${b.id}">Can't make it</button></div>`;
        else if (review.includes(r)) foot = `<div class="row"><span class="tiny muted grow">${a.status === "shortlisted" ? `You're on ${esc(hostName)}'s shortlist. ${esc(closes(g.deadline))}.` : `Sent ${agoText(a.at)}. ${esc(closes(g.deadline))}.`}</span><button class="btn sm line" data-a="withdraw" data-id="${a.id}">Withdraw</button></div>`;
        return `<div class="track ${isBooked(r) ? "booked" : ""}"><button class="row" style="width:100%;text-align:left" data-a="gig" data-id="${g.id}">${thumb(g, 52)}
          <span class="col grow" style="gap:2px"><b class="ellipsis">${esc(g.title)}</b><span class="tiny muted ellipsis">${esc(g.venue)} · ${wk(g.starts)} ${time(g.starts)}${isBooked(r) ? ` · ${relDay(g.starts)}` : ""}</span></span></button>${journey(a, b)}${foot}</div>`; };
      const group = (title, items) => items.length ? `<section class="section"><div class="section-head"><h3>${title}</h3><span class="tiny faint mono">${items.length}</span></div>${items.map(card).join("")}</section>` : "";
      body = rows.length ? group("Booked", upcoming) + group("In review", review) + group("Closed", done)
        : emptyState("No applications yet", "Apply to a gig and follow it here, from applied to played.", `<button class="btn sm pink" data-a="tab" data-id="gigs">Find gigs</button>`);
    } else if (view === "venue") {
      body = (myVenues.length ? myVenues.map((v) => {
        const rows = (S.venueBookings[v.id] || []).filter((b) => new Date(b.ends) > new Date());
        const waiting = rows.filter((b) => b.status === "requested"), upcoming = rows.filter((b) => b.status === "confirmed");
        return `${venueCard(v)}${waiting.length ? `<section class="section" style="gap:8px"><div class="section-head"><h3>Requests</h3><span class="tiny faint mono">${waiting.length}</span></div>${waiting.map(requestRow).join("")}</section>` : ""}
          ${upcoming.length ? `<section class="section" style="gap:0"><span class="eyebrow">Confirmed</span>${upcoming.map((b) => `<div class="list-row">${av(b.requester, "sm")}<span class="grow small"><b>${prettyDay(istDayOf(b.starts))}, ${slotLabel(b.starts, b.ends)}</b> · ${esc(nm(b.requester))}</span>${st("confirmed")}</div>`).join("")}</section>` : ""}
          ${!waiting.length && !upcoming.length ? `<div class="small muted">No requests yet. Share your venue so hosts can find it.</div>` : ""}`;
      }).join("") : emptyState("List your venue", "Hosts pick a free date and send you a request. You confirm, they pay you directly."))
        + `<button class="btn ${myVenues.length ? "line" : "pink"} block" data-a="venueform">${ic("plus", 18)} ${myVenues.length ? "List another venue" : "List my venue"}</button>`;
    } else {
      const list = S.gigs.filter(manages).sort((a, b) => a.starts.localeCompare(b.starts));
      const reqs = S.venueReqs.filter((b) => new Date(b.ends) > new Date() && ["requested", "confirmed"].includes(b.status));
      body = `<div class="row"><button class="btn pink grow" data-a="go" data-id="newgig">${ic("plus", 18)} Post a gig</button><button class="btn line grow" data-a="go" data-id="venues">Find a venue</button></div>`
        + (reqs.length ? `<section class="section" style="gap:0"><span class="eyebrow">Venue bookings</span>${reqs.map((b) => `<button class="list-row" data-a="venue" data-id="${b.venue}">
          <span class="grow small"><b>${esc(b.venueName)}</b><span class="tiny muted" style="display:block">${prettyDay(istDayOf(b.starts))}, ${slotLabel(b.starts, b.ends)}</span></span>${st(b.status === "confirmed" ? "confirmed" : "submitted", b.status === "confirmed" ? "Confirmed" : "Requested")}</button>`).join("")}</section>` : "")
        + (list.length ? list.map((g) => {
        const waiting = S.apps.filter((x) => x.gig === g.id && ["submitted", "shortlisted"].includes(x.status)).length, bk = booked(g);
        return `<div class="track"><button class="row" style="width:100%;text-align:left" data-a="gig" data-id="${g.id}">${thumb(g, 52)}
          <span class="col grow" style="gap:2px"><b class="ellipsis">${esc(g.title)}</b><span class="tiny muted">${g.status === "draft" ? st("draft", "Draft") : esc(closes(g.deadline))}</span></span></button>
          <div class="col" style="gap:6px"><div class="row tiny" style="justify-content:space-between"><span class="muted">${bk >= g.capacity ? "Fully booked" : "Spots booked"}</span><b class="mono">${bk} / ${g.capacity}</b></div>${meter(g)}</div>
          <button class="btn sm ${waiting ? "pink" : "line"} block" data-a="review" data-id="${g.id}">${waiting ? `Review ${waiting} applicant${waiting > 1 ? "s" : ""}` : "See applicants"}</button></div>`;
      }).join("") : emptyState("Nothing posted yet", "Post your first gig and artists can apply within minutes."));
    }
    return bigHead("My gigs", "", bell()) + `<div class="page">${seg}${body}</div>`;
  },

  venues() {
    const q = ui.vq.trim().toLowerCase();
    const list = venueList().filter((v) => !q || `${v.name} ${v.city} ${v.headline} ${v.desc}`.toLowerCase().includes(q));
    return bar("Book a venue", store.me && (has("venue") || has("organizer")) ? `<button class="btn sm line" data-a="venueform">List yours</button>` : "") + `<div class="page" style="padding-top:14px">
      <div class="row" style="padding:0 14px;border-radius:14px;background:var(--card);border:1.5px solid var(--rule);gap:8px">${ic("search", 18)}
        <input id="vq" class="input" placeholder="City, vibe, venue name" value="${esc(ui.vq)}" style="border:0;background:transparent;padding-left:0;min-height:46px" aria-label="Search venues"></div>
      ${list.length ? list.map(venueCard).join("") : emptyState("No venues yet", "Venues listed on EQura show up here with their free dates.")}</div>`;
  },

  venue({ id }) {
    const v = S.venues[id]; if (!v) return bar("Venue") + emptyState("Venue not found");
    const u = me(), cal = ui.cal?.venue === id ? ui.cal : { sel: null }, sel = cal.sel;
    const rows = v.mine ? (S.venueBookings[id] || []).filter((b) => new Date(b.ends) > new Date()) : [];
    const pick = sel && chosenSlot(sel, cal.start, cal.end);
    const clash = pick && (S.avail[id] || []).find((x) => (x.status === "booked" || x.status === "blocked") && overlaps(pick, x));
    const when = pick && slotLabel(pick.starts_at, pick.ends_at);
    let cta;
    if (!u) cta = `<button class="btn pink block" data-a="login">Sign in to book</button>`;
    else if (!sel) cta = v.mine ? `<button class="btn line block" data-a="venueform" data-id="${id}">${ic("edit", 16)} Edit listing</button>`
      : `<button class="btn block" disabled>Pick a date on the calendar</button>`;
    else if (clash) cta = `<button class="btn block" disabled>That time overlaps a booking</button>`;
    else if (v.mine) cta = `<button class="btn line block" data-a="block">Block ${prettyDay(sel)}, ${when}</button>`;
    else cta = `<button class="btn pink block" data-a="openvreq" data-id="${id}">Request ${prettyDay(sel)}, ${when}</button><div class="hint" style="text-align:center">${fromPrice(v)} · no payment taken in the app</div>`;
    const selRows = rows.filter((b) => b.status === "requested" && (!sel || istDayOf(b.starts) === sel));
    return `<div class="vhero">${venueArt(v, "big")}<div class="float"><button class="float-btn" data-a="back" aria-label="Back">${ic("back", 20)}</button><button class="float-btn" data-a="share" data-id="venues/${id}" aria-label="Share">${ic("share", 18)}</button></div></div>
      ${v.photos.length > 1 ? mediaGrid(v.photos.slice(1)).replace('class="mgrid', 'class="mgrid strip') : ""}
      <div class="page" style="padding-top:16px;padding-bottom:130px">
        <div class="col" style="gap:4px"><span class="eyebrow">${esc(v.city || "Venue")}${v.address ? ` · ${esc(v.address)}` : ""}</span><div class="display" style="font-size:44px">${esc(v.name)}</div>
          ${v.headline ? `<div style="font-size:17px">${esc(v.headline)}</div>` : ""}</div>
        <div class="stubline"><div><span class="eyebrow">Capacity</span><b>${v.capacity || "–"}</b><span class="tiny muted">people</span></div>
          <div><span class="eyebrow">Price</span><b style="color:var(--yellow)">${v.price ? `₹${v.price.toLocaleString("en-IN")}` : "Ask"}</b><span class="tiny muted">starting</span></div>
          <div><span class="eyebrow">Booked by</span><b>Date</b><span class="tiny muted">one event a day</span></div></div>
        ${v.terms ? `<div class="terms"><span class="eyebrow">Pricing &amp; payment</span><p class="pre" style="margin:0">${esc(v.terms)}</p></div>` : ""}
        <section class="section"><div class="section-head"><h3>${v.mine ? "Your calendar" : "Pick a date and time"}</h3></div>${calendar(v)}${sel ? dayPanel(v) : ""}</section>
        ${v.mine && selRows.length ? `<section class="section" style="gap:8px"><div class="section-head"><h3>Requests${sel ? ` for ${prettyDay(sel)}` : ""}</h3></div>${selRows.map(requestRow).join("")}</section>` : ""}
        ${v.desc ? `<section class="section"><span class="eyebrow">About the venue</span><p class="pre" style="margin:0;font-size:16px">${esc(v.desc)}</p></section>` : ""}
        ${v.amenities.length ? `<section class="section"><span class="eyebrow">What you get</span><ul class="checklist">${v.amenities.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></section>` : ""}
        ${v.managers.length ? `<section class="section"><span class="eyebrow">Run by</span><div class="host">${av(v.managers[0])}<button class="col grow" style="gap:0;text-align:left" data-a="profile" data-id="${v.managers[0]}"><b>${esc(nm(v.managers[0]))}</b><span class="tiny muted">Venue manager</span></button>
          ${u && !v.mine ? `<button class="btn sm line" data-a="message" data-id="${v.managers[0]}">Message</button>` : ""}</div></section>` : ""}
      </div><div class="sticky-cta">${cta}</div>`;
  },

  venueform({ id }) {
    const v = id && S.venues[id];
    const f = ui.vform || (ui.vform = { id: id || null, name: v?.name || "", headline: v?.headline || "", city: v?.city || "", address: v?.address || "", capacity: v?.capacity || "",
      price: v?.price || "", terms: v?.terms || "", amenities: (v?.amenities || []).join("\n"), desc: v?.desc || "", listed: v ? v.listed : true, photos: [...(v?.photos || [])], files: [] });

      <button class="btn pink block" data-a="savevenue">${id ? "Save changes" : "List my venue"}</button></div>`;

  review({ id }) {
    const g = gig(id);
    if (!g || !manages(g)) return bar("Applicants") + emptyState("Hosts only", "Only this gig's host can see who applied.");
    const all = S.apps.filter((a) => a.gig === id);
    const pending = all.filter((a) => ["submitted", "shortlisted"].includes(a.status)).sort((x, y) => (y.status === "shortlisted") - (x.status === "shortlisted") || x.at.localeCompare(y.at));
    const decided = all.filter((a) => !pending.includes(a)), full = booked(g) >= g.capacity;
    const i = Math.min(ui.reviewIdx, Math.max(0, pending.length - 1)), a = pending[i];
    const head = `<div class="col" style="gap:8px"><div class="row" style="justify-content:space-between"><span class="eyebrow">${full ? "Fully booked" : "Spots booked"}</span><b class="mono">${booked(g)} / ${g.capacity}</b></div>${meter(g)}</div>`;
    let deck = emptyState("All caught up", full ? "Every spot is booked." : all.length ? "No one is waiting for a decision." : "No applications yet. Share the gig to get the word out.");
    if (a) {
      const u = user(a.user) || { id: a.user, name: "Artist", headline: "", genres: [] }, overlap = (u.genres || []).filter((x) => g.genres.includes(x));
      deck = `<div class="deck"><div class="top">
        <div class="row"><button data-a="profile" data-id="${u.id}" aria-label="${esc(u.name)}">${av(u.id)}</button><button class="col grow" style="gap:0;text-align:left" data-a="profile" data-id="${u.id}"><b style="font-size:17px">${esc(u.name)}</b><span class="tiny muted">${esc(u.headline || "Artist on EQura")}</span></button>${st(a.status)}</div>
        ${overlap.length ? `<div class="row wrap" style="gap:6px">${overlap.map((x) => `<span class="tag match">${ic("star", 11, true)} #${esc(x)}</span>`).join("")}</div>` : ""}
        ${a.note ? `<div class="note pre">${esc(a.note)}</div>` : `<div class="small faint">No note.</div>`}
        ${a.works.length ? `<div class="col" style="gap:8px"><span class="eyebrow">Listen before you book</span>${a.works.map(player).join("")}</div>` : ""}
        <div class="tiny faint">Applied ${agoText(a.at)}</div></div>
        ${full ? `<div style="padding:0 18px"><div class="banner full">${ic("check", 18)}<span><b>Fully booked.</b> To book ${esc(u.name.split(" ")[0])}, cancel a booking first.</span></div></div>` : ""}
        <div class="actions"><button class="btn bad sm" data-a="decide" data-id="${a.id}" data-to="decline">Pass</button>
          <button class="btn line sm" data-a="decide" data-id="${a.id}" data-to="shortlist" ${a.status === "shortlisted" ? "disabled" : ""}>${a.status === "shortlisted" ? "Shortlisted" : "Shortlist"}</button>
          <button class="btn pink sm" data-a="decide" data-id="${a.id}" data-to="accept" ${full ? "disabled" : ""}>${ic("check", 16)} Book</button></div></div>
        <div class="row" style="justify-content:space-between"><button class="btn sm line" data-a="ridx" data-id="${i - 1}" ${i === 0 ? "disabled" : ""} aria-label="Previous applicant">${ic("left", 16)}</button>
          <span class="small muted mono">${i + 1} of ${pending.length} to review</span>
          <button class="btn sm line" data-a="ridx" data-id="${i + 1}" ${i >= pending.length - 1 ? "disabled" : ""} aria-label="Next applicant">${ic("right", 16)}</button></div>`;
    }
    return bar(esc(g.title)) + `<div class="page" style="padding-top:14px">${head}${deck}
      ${decided.length ? `<section class="section" style="gap:0"><span class="eyebrow">Decided</span>${decided.map((d) => `<div class="list-row">${av(d.user, "sm")}<span class="grow">${esc(nm(d.user))}</span>${st(d.status)}
        ${d.status === "accepted" ? `<button class="btn sm line" data-a="message" data-id="${d.user}">Message</button>` : ""}</div>`).join("")}</section>` : ""}</div>`;
  },

        <div class="field"><label for="ng-desc">What should artists know?</label><textarea id="ng-desc" class="textarea" data-k="desc">${esc(d.desc)}</textarea></div>
        <div class="row"><button type="button" class="btn line grow" data-a="savegig" data-id="draft">Save draft</button><button type="button" class="btn pink grow" data-a="savegig" data-id="published">Put it on the wall</button></div>
      </form></div>`;

    ${ui.lightbox ? `<div class="lightbox" data-a="closelightbox" role="dialog" aria-label="Photo"><img src="${esc(ui.lightbox)}" alt=""></div>` : ""}
    ${ui.toast ? `<div class="toast ${ui.toast.bad ? "bad" : ""}" role="status">${ui.toast.bad ? ic("x", 18) : ic("check", 18)}<span>${esc(ui.toast.text)}</span></div>` : ""}`;
  for (const [id, v] of Object.entries(keepVals)) { const el = document.getElementById(id); if (el && !el.disabled) { if (el.type === "checkbox") el.checked = v; else if (el.value !== v && id !== "q" && !id.startsWith("sl-")) el.value = v; } }
  if (focused) { const el = document.getElementById(focused); if (el) { el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch {} } }
  const sc = phone.querySelector(".scroll");
  sc.scrollTop = r.name === "thread" ? sc.scrollHeight : keep;
  const w = phone.querySelector(".wall"); if (w && !top) w.scrollLeft = wallKeep;
  renderRail();
}
function renderRail() {
  const el = document.getElementById("account"); if (!el) return;
  el.innerHTML = store.me ? `Signed in as <b>${esc(store.me.display_name)}</b>` : "Not signed in";
}

/* ======================= Events ======================= */
const val = (id) => (document.getElementById(id)?.value ?? "").trim();
const errBox = (id, t) => { const el = document.getElementById(id); if (el) el.innerHTML = `<div class="banner err">${esc(t)}</div>`; };
async function signedIn(meData) {
  store.me = meData; ui.sheet = null; ui.stack = [];
  await refresh(); render(true);
}
function act(a, id, el) {
  const u = me();
  const need = () => { if (!u) { openSheet("login"); return true; } };
  switch (a) {
    case "login": ui.sheet = { kind: "login" }; render(); setTimeout(() => document.getElementById("li-email")?.focus(), 50); break;
    case "register": ui.sheet = { kind: "register", role: id }; render(); break;
    case "dologin": {
      const email = val("li-email"), password = document.getElementById("li-pw").value;
      if (!email || !password) { errBox("auth-err", "Enter your email and password."); break; }
      ui.busy = true; renderBusy();
      post("/auth/login", { email, password }).then(async (m) => { ui.busy = false; renderBusy(); await signedIn(m); toast(`Welcome back, ${m.display_name.split(" ")[0]}`); })
        .catch((e) => { ui.busy = false; renderBusy(); errBox("auth-err", e instanceof ApiErr ? e.text : "Couldn't sign in."); });
      break;
    }
    case "doregister": {
      const roles = [document.getElementById("rg-artist").checked && "artist", document.getElementById("rg-host").checked && "organizer", document.getElementById("rg-venue").checked && "venue"].filter(Boolean);
      const display_name = val("rg-name"), email = val("rg-email"), password = document.getElementById("rg-pw").value;
      if (!display_name || !email || !password) { errBox("auth-err", "Fill in your name, email and a password."); break; }
      if (!roles.length) { errBox("auth-err", "Pick at least one: perform, host or run a venue."); break; }
      ui.busy = true; renderBusy();
      post("/auth/register", { display_name, email, password, roles })
        .then(() => post("/auth/login", { email, password }))
        .then(async (m) => { ui.busy = false; renderBusy(); await signedIn(m); ui.tab = "profile"; render(true); toast(`Welcome to EQura, ${display_name.split(" ")[0]}!`); })
        .catch((e) => { ui.busy = false; renderBusy(); errBox("auth-err", e instanceof ApiErr ? e.text : "Couldn't create your account."); });
      break;
    }
    case "logout": run(async () => { await post("/auth/logout"); store.me = null; ui.tab = "gigs"; ui.stack = []; }, "Signed out"); break;
    case "retry": boot(); break;
    case "addrole": if (need()) break; run(async () => { await post("/auth/me/roles", { role: id }); store.me = await api("/auth/me"); }, { organizer: "You can host gigs now", venue: "You can list your venue now", artist: "You can apply to gigs now" }[id]); break;
    case "editme": ui.sheet = { kind: "profile" }; render(); break;
    case "saveme": {
      const name = val("pf-name"); if (!name) { errBox("pf-err", "Add your name or stage name."); break; }
      const body = { display_name: name, headline: val("pf-headline"), bio: val("pf-bio"), location_label: val("pf-city") };
      if (has("artist")) body.artist = { artist_name: name, genres: [...phone.querySelectorAll(".pf-genre:checked")].map((x) => x.value) };
      const link = val("pf-link"), linkTitle = val("pf-link-title");
      run(async () => {
        await api("/profiles/me", { method: "PATCH", body });
        if (link) await post("/profiles/me/portfolio", { title: linkTitle || "My work", url: link, item_type: /youtu|vimeo/.test(link) ? "video" : /soundcloud|spotify|bandcamp/.test(link) ? "audio" : "link" });
        store.me = await api("/auth/me"); ui.sheet = null;
      }, "Profile saved");
      break;
    }
    case "tab": ui.tab = id; ui.stack = []; ui.sheet = null; render(true); if (id === "profile" && !store.me) openSheet("login"); break;
    case "go": go(id); break;
    case "back": back(); break;
    case "gig": go("gig", { id }); break;
    case "post": go("post", { id }); break;
    case "profile": if (u && id === u.id) { ui.tab = "profile"; ui.stack = []; render(true); } else go("profile", { id }); break;
    case "review": ui.reviewIdx = 0; go("review", { id }); break;
    case "thread": go("thread", { id }); break;
    case "filter": ui.filter = id; render(); break;
    case "clearfilters": ui.filter = "all"; ui.q = ""; render(); break;
    case "mineview": ui.mine = id; render(true); break;
    case "sceneview": ui.scene = id; render(true); break;
    case "ridx": ui.reviewIdx = Number(id); ui.playing = null; render(); break;
    case "play": { ui.playing = ui.playing === id ? null : id; const w = [...Object.values(S.users).flatMap((x) => x.portfolio || []), ...S.apps.flatMap((x) => x.works)].find((x) => x.id === id);
      if (ui.playing && w?.url && /^https?:/.test(w.url)) window.open(w.url, "_blank", "noopener"); render(); break; }
    case "celebrated": celebrated.add(id); saveCelebrated(); { const b = S.bookings.find((x) => x.id === id); render(); if (b) go("gig", { id: b.gig }); } break;
    case "share": { const link = `${location.origin}/${id}`; const pr = navigator.clipboard?.writeText(link); if (pr) pr.then(() => toast("Link copied"), () => toast(link)); else toast(link); break; }
    case "compose": if (need()) break; ui.compose = []; ui.sheet = { kind: "compose" }; render(); setTimeout(() => document.getElementById("compose")?.focus(), 50); break;
    case "publish": { const body = val("compose"), files = ui.compose;
      if (!body && !files.length) return toast("Write something or add a photo.", true);
      run(async () => {
        const media_ids = [];
        for (const [i, f] of files.entries()) { if (files.length) toast(`Uploading ${i + 1} of ${files.length}…`); media_ids.push((await uploadMedia(f.file)).id); }
        await post("/posts", { body, media_ids }); ui.sheet = null; ui.compose = []; ui.scene = "everyone"; ui.tab = "scene"; ui.stack = [];
      }, "Posted"); break; }
    case "rmfile": ui.compose = ui.compose.filter((f) => f.key !== id); if (ui.vform) ui.vform.files = ui.vform.files.filter((f) => f.key !== id); render(); break;
    case "rmphoto": ui.vform.photos = ui.vform.photos.filter((ph) => ph.id !== id); render(); break;
    case "lightbox": ui.lightbox = id; render(); break;
    case "closelightbox": ui.lightbox = null; render(); break;
    case "venue": go("venue", { id }); break;
    case "pickday": if (ui.cal?.venue !== cur().id) ui.cal = { venue: cur().id, off: 0, sel: null };
      ui.cal.sel = ui.cal.sel === id ? null : id; ui.cal.start ||= "18:00"; ui.cal.end ||= "23:00"; render(); break;
    case "preset": [ui.cal.start, ui.cal.end] = id.split("|"); render(); break;
    case "calnav": if (ui.cal?.venue !== cur().id) ui.cal = { venue: cur().id, off: 0, sel: null }; ui.cal.off = Math.max(0, Math.min(2, ui.cal.off + Number(id))); render(); break;
    case "openvreq": if (need()) break; ui.sheet = { kind: "vreq", id }; render(); break;
    case "sendvreq": { const date = ui.cal.sel, n = Number(val("vr-n")) || null, message = val("vr-msg");
      ui.busy = true; renderBusy();
      post(`/venues/${id}/bookings`, { ...chosenSlot(date, ui.cal.start, ui.cal.end), message, expected_headcount: n })
        .then(async () => { await refresh(); await loadAvail(id); ui.busy = false; renderBusy(); ui.sheet = null; toast(`Request sent to ${S.venues[id].name}. You'll hear back here.`); })
        .catch((e) => { ui.busy = false; renderBusy(); errBox("vreq-err", e instanceof ApiErr ? e.text : "Couldn't send. Try again."); });
      break; }
    case "cancelvreq": { const vid = cur().id; run(async () => { await post(`/venue-bookings/${id}/cancel`); await loadAvail(vid); }, "Request cancelled"); break; }
    case "vdecide": { const to = el.dataset.to, b = Object.values(S.venueBookings).flat().find((x) => x.id === id);
      run(async () => { await post(`/venue-bookings/${id}/${to}`); if (b) await loadAvail(b.venue); },
        to === "confirm" ? `Confirmed. ${b ? first(b.requester) : "They"} has been notified.` : "Declined. They've been notified."); break; }
    case "block": { const vid = cur().id, slot = chosenSlot(ui.cal.sel, ui.cal.start, ui.cal.end);
      run(async () => { await post(`/venues/${vid}/blocks`, slot); await loadAvail(vid); }, `${slotLabel(slot.starts_at, slot.ends_at)} marked unavailable`); break; }
    case "unblock": { const vid = cur().id; run(async () => { await post(`/venue-bookings/${id}/cancel`); await loadAvail(vid); }, "That time is open again"); break; }
    case "venueform": if (need()) break; ui.vform = null; go("venueform", { id: id || null }); break;
    case "savevenue": { const f = ui.vform; f.listed = document.getElementById("vf-listed").checked;
      if (!f.name.trim()) { errBox("vf-err", "Give your venue a name."); break; }
      run(async () => {
        const ids = f.photos.map((ph) => ph.id);
        for (const [i, file] of f.files.entries()) { toast(`Uploading photo ${i + 1} of ${f.files.length}…`); ids.push((await uploadMedia(file.file)).id); }
        const body = { name: f.name.trim(), headline: f.headline.trim(), city: f.city.trim(), address_text: f.address.trim(), capacity: Number(f.capacity) || null,
          starting_price: Number(f.price) > 0 ? String(Number(f.price)) : null, payment_terms: f.terms.trim(), amenities: f.amenities.trim(), description: f.desc.trim(),
          is_listed: f.listed, photo_ids: ids };
        const v = f.id ? await api(`/venues/${f.id}`, { method: "PATCH", body }) : await post("/venues", body);
        return v.id;
      }, f.id ? "Venue updated" : "Your venue is listed. Hosts can request dates now.").then((vid) => { if (!vid) return; ui.vform = null; ui.stack = ui.stack.filter((r) => r.name !== "venueform" && r.name !== "venue"); go("venue", { id: vid }); });
      break; }
    case "like": { if (need()) break; const p = S.posts.find((x) => x.id === id);
      p.liked = !p.liked; p.likes += p.liked ? 1 : -1; render(); // instant feedback; the refresh confirms
      run(() => (p.liked ? post(`/posts/${id}/like`) : del(`/posts/${id}/like`))); break; }
    case "repost": if (need()) break; run(() => post(`/posts/${id}/repost`, {}), "Reposted to your followers"); break;
    case "comment": { const body = val("cbody"); if (!body) break;
      run(async () => { await post(`/posts/${id}/comments`, { body }); document.getElementById("cbody").value = ""; await loadComments(id); }); break; }
    case "follow": { if (need()) break; const p = user(id);
      run(async () => { if (p.viewerFollowing) await del(`/users/${id}/follow`); else await post(`/users/${id}/follow`); await loadProfile(id); }, p.viewerFollowing ? "Unfollowed" : `Following ${first(id)}`); break; }
    case "message": { if (need()) break; if (el?.dataset.b) { celebrated.add(el.dataset.b); saveCelebrated(); }
      run(async () => { const c = await post("/conversations", { user_id: id }); return c.id; }).then((cid) => { if (!cid) return; ui.tab = "inbox"; ui.stack = []; go("thread", { id: cid }); }); break; }
    case "send": { const body = val("mbody"); if (!body) break; document.getElementById("mbody").value = "";
      (S.messages[id] ||= []).push({ id: "tmp" + Date.now(), from: u.id, body, at: new Date().toISOString() }); render();
      post(`/conversations/${id}/messages`, { body }).then(() => loadMessages(id)).catch((e) => toast(e instanceof ApiErr ? e.text : "Message not sent.", true));
      setTimeout(() => document.getElementById("mbody")?.focus(), 0); break; }
    case "openapply": if (need()) break; ui.sheet = { kind: "apply", id }; render(); break;
    case "addprompt": { const t = document.getElementById("note"); t.value = (t.value ? t.value.trimEnd() + "\n" : "") + id; t.focus(); break; }
    case "apply": { const items = [...phone.querySelectorAll(".pick:checked")].map((x) => x.value), note = val("note");
      ui.busy = true; renderBusy();
      post(`/opportunities/${id}/applications`, { cover_note: note, portfolio_item_ids: items })
        .then(async () => { await refresh(); ui.busy = false; renderBusy(); ui.sheet = { kind: "apply", id, done: true }; render(); })
        .catch((e) => { ui.busy = false; renderBusy(); errBox("apply-err", e instanceof ApiErr ? e.text : "Couldn't send. Try again."); });
      break; }
    case "trackit": ui.sheet = null; ui.tab = "mine"; ui.mine = "playing"; ui.stack = []; render(true); break;
    case "closesheet": ui.sheet = null; render(); break;
    case "decide": { const to = el.dataset.to, ap = S.apps.find((x) => x.id === id), name = first(ap.user); ui.playing = null;
      run(() => post(`/applications/${id}/${to}`, {}), { accept: `${name} is booked and has been notified`, shortlist: `${name} is on your shortlist`, decline: `Passed on ${name}. They've been notified.` }[to]); break; }
    case "withdraw": run(() => post(`/applications/${id}/withdraw`, {}), "Application withdrawn"); break;
    case "askcancel": ui.confirm = id; render(); break;
    case "keep": ui.confirm = null; render(); break;
    case "cancelbooking": ui.confirm = null; run(() => post(`/bookings/${id}/cancel`, { reason: "Cancelled in the app" }), "Booking cancelled. The other side has been told."); break;
    case "readall": run(() => post("/notifications/read-all")); break;
    case "notif": { const n = S.notifs.find((x) => x.id === id); if (!n.read) { n.read = true; post(`/notifications/${id}/read`).catch(() => {}); }
      if (["application.submitted", "application.withdrawn"].includes(n.type) && gig(n.gig)) { ui.reviewIdx = 0; go("review", { id: n.gig }); }
      else if (n.venue && S.venues[n.venue]) go("venue", { id: n.venue });
      else if (n.gig && gig(n.gig)) go("gig", { id: n.gig }); else if (n.post) go("post", { id: n.post }); else if (n.actor) go("profile", { id: n.actor }); else render(); break; }
    case "publishgig": run(() => post(`/opportunities/${id}/publish`), "It's on the wall. Artists can apply now."); break;
    case "savegig": { const d = ui.draft, missing = [!d.title.trim() && "a title", !d.venue.trim() && "a venue", !d.desc.trim() && "a description"].filter(Boolean);
      if (id === "published" && missing.length) { errBox("ng-err", `To publish, add ${missing.join(", ")}.`); break; }
      if (d.comp === "paid" && !(Number(d.amount) > 0)) { errBox("ng-err", "Add the amount for a paid gig so artists know what it pays."); break; }
      const g = draftGig(d);
      const body = { title: d.title.trim(), description: d.desc.trim(), opportunity_type: d.type, compensation_type: d.comp,
        compensation_amount: d.comp === "paid" ? String(Number(d.amount)) : null, currency: d.comp === "paid" ? "INR" : "",
        capacity: g.capacity, location_text: [d.venue.trim(), d.area.trim()].filter(Boolean).join(", "), starts_at: g.starts, application_deadline: g.deadline,
        requirements: "", genres: [d.genre], timezone: "Asia/Kolkata" };
      run(async () => { const created = await post("/opportunities", body); if (id === "published") await post(`/opportunities/${created.id}/publish`); return created.id; },
        id === "published" ? "It's on the wall. Artists can apply now." : "Saved as a draft")
        .then((gid) => { if (!gid) return; ui.draft = null; ui.tab = "mine"; ui.mine = "hosting"; ui.stack = [{ name: "gig", id: gid }]; render(true); });
      break; }
  }
}
document.addEventListener("click", (e) => { const el = e.target.closest("[data-a]"); if (!el || el.disabled) return; e.preventDefault(); act(el.dataset.a, el.dataset.id, el); });
document.addEventListener("submit", (e) => e.preventDefault());
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  if (e.target.id === "mbody") act("send", phone.querySelector('[data-a="send"]').dataset.id);
  if (e.target.id === "cbody") act("comment", phone.querySelector('[data-a="comment"]').dataset.id);
  if (e.target.id === "li-pw" || e.target.id === "li-email") act("dologin");
});
document.addEventListener("change", (e) => {
  if (e.target.classList?.contains("pf-genre")) e.target.closest(".chip").classList.toggle("on", e.target.checked);
  if (e.target.dataset?.slot && ui.cal) { ui.cal[e.target.dataset.slot] = e.target.value; render(); }
  if (e.target.id === "cfile") { addFiles(ui.compose, e.target.files, 4); e.target.value = ""; render(); }
  if (e.target.id === "vf-file") { addFiles(ui.vform.files, [...e.target.files].filter((f) => f.type.startsWith("image/")), 8 - ui.vform.photos.length); e.target.value = ""; render(); }
  onDraft(e);
});
function onDraft(e) {
  const k = e.target.dataset?.k; if (!k || !ui.draft) return;
  ui.draft[k] = e.target.value;
  const pv = document.getElementById("pv"); if (pv) pv.innerHTML = flyer(draftGig(ui.draft), 1, "div");
  if (k === "comp") { const amt = document.getElementById("ng-amt"); amt.disabled = ui.draft.comp !== "paid"; amt.placeholder = ui.draft.comp === "paid" ? "5000" : "n/a"; }
}
document.addEventListener("input", (e) => {
  if (e.target.id === "q") { ui.q = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById("q"); q.focus(); q.setSelectionRange(pos, pos); return; }
  if (e.target.id === "vq") { ui.vq = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById("vq"); q.focus(); q.setSelectionRange(pos, pos); return; }
  if (e.target.dataset?.vf && ui.vform) { ui.vform[e.target.dataset.vf] = e.target.value; return; }
  onDraft(e);
});
document.getElementById("theme")?.addEventListener("click", () => {
  const root = document.documentElement, light = root.dataset.theme ? root.dataset.theme === "light" : matchMedia("(prefers-color-scheme: light)").matches;
  root.dataset.theme = light ? "dark" : "light";
});

/* Keep screens fresh: other people's actions show up within seconds while the app is open. */
let polling = false;
setInterval(async () => {
  if (polling || ui.busy || ui.sheet || ui.lightbox || document.hidden || !store.ready) return;
  // Re-rendering would restart a playing video or wipe a half-filled form: wait.
  if ([...document.querySelectorAll("video")].some((v) => !v.paused) || cur().name === "venueform" || cur().name === "newgig") return;
  polling = true;
  try { await refresh(); const r = cur(); if (r.name === "thread") await loadMessages(r.id); else if (r.name === "venue") await loadAvail(r.id); else render(); } catch {} finally { polling = false; }
}, 8000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && store.ready) refresh().then(() => render()).catch(() => {}); });

async function boot() {
  store.offline = false; render();
  for (let attempt = 0; attempt < 4; attempt++) {
    try {
      store.me = await api("/auth/me").catch((e) => { if (e.status === 401 || e.status === 403) return null; throw e; });
      await refresh(); render(true); return;
    } catch { await new Promise((r) => setTimeout(r, 4000)); }
  }
  store.offline = true; render();
}
render();
boot();
</script>
