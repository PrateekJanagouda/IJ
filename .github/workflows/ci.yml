name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eqora
          POSTGRES_USER: eqora
          POSTGRES_PASSWORD: eqora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eqora" --health-interval 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Migrations are committed
        run: DJANGO_DEBUG=true python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema generates without warnings
        run: DJANGO_DEBUG=true python manage.py spectacular --fail-on-warn --file /tmp/schema.yml
      - name: Tests
        run: pytest
      - name: Production settings check
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdefghijklmnopqrstuvwxyz
          DJANGO_ALLOWED_HOSTS: api.example.com
