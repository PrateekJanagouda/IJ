name: Android app

# Builds the EQura Android app (Capacitor) and publishes the APK as a
# pre-release named "equra-android-latest", so it can be downloaded on a phone.
on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      app_url:
        description: "Hosted EQura URL (e.g. https://equra.onrender.com). Empty = offline demo build."
        required: false
        default: ""

permissions:
  contents: write # needed to publish the APK on the release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Point the app at the hosted server (real accounts and login)
        env:
          APP_URL: ${{ inputs.app_url || vars.EQURA_URL }}
        if: ${{ inputs.app_url != '' || vars.EQURA_URL != '' }}
        run: |
          node -e '
            const fs = require("fs"), f = "capacitor.config.json", c = JSON.parse(fs.readFileSync(f));
            const url = process.env.APP_URL.replace(/\/$/, "");
            c.server = { url: url + "/login", allowNavigation: [new URL(url).host] };
            fs.writeFileSync(f, JSON.stringify(c, null, 2));
            console.log(c.server);'
      - name: Copy the web app into the Android project
        run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build APK (Android SDK is preinstalled on GitHub runners)
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk EQura.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EQura-android
          path: mobile/EQura.apk
      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete equra-android-latest --yes --cleanup-tag || true
          gh release create equra-android-latest EQura.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "EQura for Android (test build)" \
            --notes "${{ (inputs.app_url || vars.EQURA_URL) && format('Connected to {0}. Sign up or log in with a real account.', inputs.app_url || vars.EQURA_URL) || 'Offline demo build: data is saved on the phone.' }} Built from ${{ github.ref_name }} @ ${{ github.sha }}. Install: download EQura.apk on your Android phone and allow installs from your browser when asked."
