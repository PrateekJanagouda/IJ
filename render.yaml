# Render Blueprint: one click creates the EQura web app and its Postgres database.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: equra
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: equra-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: 127.0.0.1,localhost,.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      # Render terminates TLS; Next forwards X-Forwarded-Proto to Django.
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "false"
      - key: SEED_DEMO
        value: "true"

databases:
  - name: equra-db
    plan: free
    databaseName: equra
    user: equra
